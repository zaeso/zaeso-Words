name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-24.04

    steps:
      - name: Получение кода
        uses: actions/checkout@v5

      - name: Установка JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Запуск тестов и сборка JAR (Java 8)
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Сохранение JAR
        uses: actions/upload-artifact@v4
        with:
          name: zaeso-words-jar-java8
          path: target/zaeso-words-*.jar
          if-no-files-found: error

      - name: Установка JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Запуск тестов и сборка JAR (Java 17)
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Сохранение JAR
        uses: actions/upload-artifact@v4
        with:
          name: zaeso-words-jar-java17
          path: target/zaeso-words-*.jar
          if-no-files-found: error

  release:
    name: Публикация релиза
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Получение кода
        uses: actions/checkout@v5

      - name: Установка JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Сборка JAR
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Упаковка сборки для Windows
        run: zip -j "target/zaeso-words-${GITHUB_REF_NAME#v}-windows.zip" target/zaeso-words-*.jar run-game.bat LICENSE.txt DICTIONARIES.md PROMPTS.md

      - name: Публикация файлов релиза
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/zaeso-words-*.jar
            target/zaeso-words-*-windows.zip
            run-game.bat
          generate_release_notes: true
          body: |
            ## Что нового в 1.3.0

            - Более 10 000 слов на каждом языке. Русский словарь содержит существительные в именительном падеже.
            - Единый загрузчик словарей и воспроизводимая выборка слов для раунда.
            - Журнал запросов с фрагментами кода и сведения о лицензиях словарей в архиве Windows.

            ## Запуск

            1. Скачайте архив для Windows из раздела Assets и распакуйте его.
            2. Установите Java 8 или новее (достаточно JRE).
            3. Дважды кликните `run-game.bat`.

            Либо запустите вручную из папки с JAR:

            ```bash
            java -jar zaeso-words-1.3.0.jar
            ```

            Maven не нужен. Для отладочного консольного режима добавьте `--console`.
            В настройках можно выбрать русский словарь или «Английские слова».
            В разделе «Рекорды» доступны полная таблица результатов и экспорт истории в CSV.
