name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-24.04

    steps:
      - name: Получение кода
        uses: actions/checkout@v5

      - name: Установка JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Запуск тестов и сборка JAR
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Сохранение JAR
        uses: actions/upload-artifact@v4
        with:
          name: zaeso-words-jar
          path: target/zaeso-words-*.jar
          if-no-files-found: error

  release:
    name: Публикация релиза
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Получение кода
        uses: actions/checkout@v5

      - name: Установка JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Сборка JAR
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Прикрепление JAR к релизу
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/zaeso-words-*.jar
            run-game.bat
          generate_release_notes: true
          body: |
            ## Запуск

            1. Скачайте JAR и `run-game.bat` из раздела Assets и положите их в одну папку.
            2. Установите Java 17 или новее (достаточно JRE).
            3. Дважды кликните `run-game.bat`.

            Либо запустите вручную из папки с JAR:

            ```bash
            java -jar zaeso-words-1.0.3.jar
            ```

            Maven не нужен. Для отладочного консольного режима добавьте `--console`.
            В категории «Все русские слова» сетка собирается из случайных слов полного списка.
